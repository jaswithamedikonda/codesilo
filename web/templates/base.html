<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CodeSilo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <h1 class="logo">CodeSilo</h1>
      <nav class="nav">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('export') }}">Export CSV</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>CodeSilo — Knowledge-silo detection for codebases</p>
    </div>
  </footer>
</body>
</html>
