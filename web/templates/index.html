{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h2>Detect knowledge silos in your codebase</h2>
  <p>
    Enter a local repository path to analyze contributor concentration,
    identify risky files, and reduce single-person bottlenecks.
  </p>

  {% if error %}
    <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form class="form" method="post" action="{{ url_for('analyze') }}">
  <label for="repo_path">Repository path</label>
  <input
    type="text"
    id="repo_path"
    name="repo_path"
    placeholder="C:/Users/you/projects/my-repo"
    required
  >
  <button type="submit" class="btn btn-primary">Analyze repository</button>
</form>

<div class="sample-section">
  <h3>Try a sample repository</h3>
  <form method="post" action="{{ url_for('analyze_sample') }}" class="sample-form">
    <label for="sample_repo">Choose a sample:</label>
    <select name="sample_repo" id="sample_repo" required>
      <option value="C:/Users/jaswi/projects/requests">requests</option>
      <option value="C:/Users/jaswi/projects/arrow">arrow</option>
      <option value="C:/Users/jaswi/projects/httpie">httpie</option>
      <option value="C:/Users/jaswi/projects/rich">rich</option>
      <!-- Add or remove options as needed -->
    </select>
    <button type="submit" class="btn">Analyze sample</button>
  </form>
</div>

</section>
{% endblock %}
